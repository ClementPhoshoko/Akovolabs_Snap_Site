<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AkovoLabs Snap — Capture beyond the screen</title>
    <meta
      name="description"
      content="Capture full-page screenshots and extract any webpage into a ready-to-run React project with AI. A fast, privacy-first Chrome extension."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute("content", theme === "dark" ? "#2b2b2b" : "#ffffff");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="canonical" href="https://akovolabs-snap.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AkovoLabs Snap" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="AkovoLabs Snap — Capture beyond the screen" />
    <meta
      property="og:description"
      content="Full-page screenshots and AI design extraction. Any webpage becomes a ready-to-run React project."
    />
    <meta property="og:url" content="https://akovolabs-snap.com/" />
    <meta property="og:image" content="https://akovolabs-snap.com/extension_images_hd/home.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AkovoLabs Snap — Capture beyond the screen" />
    <meta
      name="twitter:description"
      content="Full-page screenshots and AI design extraction. Any webpage becomes a ready-to-run React project."
    />
    <meta
      name="twitter:image"
      content="https://akovolabs-snap.com/extension_images_hd/home.webp"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AkovoLabs Snap",
        "url": "https://akovolabs-snap.com/",
        "description": "Capture full-page screenshots and extract any webpage into a ready-to-run React project with AI.",
        "inLanguage": "en"
      }
    </script>
    <script type="application/ld+json">
      {

        "description": "Full-page screenshots and AI design extraction. Any webpage becomes a ready-to-run React project.",

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
  </head>

</html>
